<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#17133a"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><link rel="manifest" href="manifest.json"><style>#app{padding-top:calc(env(safe-area-inset-top,0px) + 12px)!important;padding-bottom:calc(env(safe-area-inset-bottom,0px) + 28px)!important}</style><link rel="apple-touch-icon" href="icon-180.png"><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script><title>Dreikampf Online</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@600;800;900&family=Figtree:wght@400;600;800&display=swap">
<style>
/* Layout: one-column late-night game-show stage, max 480px; marquee-bulb title card, three player colours carry every turn */
:root{
  --bg:#17133a; --bg2:#211b52; --panel:#2a2365; --line:#4a3f9a;
  --fg:#f6f2ff; --muted:#b9b1e6; --ink:#1a1442;
  --p0:#ff7a59; --p1:#3ed6c0; --p2:#ffc93c;
  --good:#4ade80; --bad:#ff5a78; --bulb:#ffe7a3; --grid:rgba(185,177,230,.09);
  --display:"Unbounded","Arial Black",system-ui,sans-serif;
  --body:"Figtree",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--bg);background-image:radial-gradient(ellipse 90% 45% at 50% -8%,#3b2f8f 0%,rgba(59,47,143,0) 70%);background-attachment:fixed;color:var(--fg);font-family:var(--body);font-size:16px;line-height:1.45;-webkit-tap-highlight-color:transparent}
#app{max-width:480px;margin:0 auto;min-height:100%;box-sizing:border-box;padding-inline:16px;padding-block:12px 28px;display:flex;flex-direction:column;gap:14px}
button{font:inherit;color:inherit;cursor:pointer;-webkit-user-select:none;user-select:none;touch-action:manipulation}
button:focus-visible,input:focus-visible{outline:3px solid var(--bulb);outline-offset:2px}
h1,h2,h3,p{margin:0}

/* top bar */
.top{display:flex;align-items:center;justify-content:space-between;gap:10px}
.mini-logo{font-family:var(--display);font-size:15px;letter-spacing:.04em;color:var(--bulb)}
.iconbtn{background:transparent;border:1.5px solid var(--line);border-radius:999px;padding:6px 14px;font-size:14px;font-weight:600;color:var(--muted)}

/* scores */
.scores{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.chip{position:relative;border:2px solid var(--c);border-radius:12px;padding:6px 8px;background:var(--bg2);min-width:0;transition:transform .2s}
.chip .nm{font-size:12px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--c)}
.chip .sc{font-family:var(--display);font-size:18px;font-variant-numeric:tabular-nums;line-height:1.2}
.chip.on{background:var(--c);transform:translateY(-2px)}
.chip.on .nm,.chip.on .sc{color:var(--ink)}
.chip.on .nm,.chip.on .sc{color:var(--ink)}
.chip .delta{position:absolute;right:6px;top:-12px;font-family:var(--display);font-size:13px;padding:1px 7px;border-radius:999px;background:var(--good);color:var(--ink);animation:rise 1.6s ease-out forwards}
.chip .delta.neg{background:var(--bad)}
@keyframes rise{0%{opacity:0;transform:translateY(6px)}15%{opacity:1;transform:none}80%{opacity:1}100%{opacity:0;transform:translateY(-8px)}}

/* marquee */
.marquee{position:relative;border-radius:24px;padding:1.5px;background:linear-gradient(135deg,rgba(255,201,60,.9),rgba(255,90,140,.7) 30%,rgba(108,184,255,.7) 60%,rgba(255,201,60,.9));background-size:250% 250%;animation:mqShift 9s ease-in-out infinite;box-shadow:0 18px 40px -18px rgba(255,120,80,.45)}
@keyframes mqShift{0%,100%{background-position:0% 50%}50%{background-position:100% 50%}}
.nofx .marquee{animation:none}
.mq-in{position:relative;z-index:1;border-radius:22.5px;padding:24px 18px 22px;text-align:center;display:flex;flex-direction:column;gap:8px;overflow:hidden;
  background:radial-gradient(120% 90% at 0% 0%,rgba(255,122,89,.28),transparent 55%),radial-gradient(120% 90% at 100% 100%,rgba(108,184,255,.22),transparent 55%),#231c5a}
.mq-in .eyebrow{align-self:center;padding:4px 10px;border-radius:999px;background:rgba(255,255,255,.08);color:#e9e4ff;letter-spacing:.14em}
.logo{font-family:var(--display);font-weight:900;font-size:clamp(34px,11vw,50px);line-height:1;letter-spacing:-.02em;background:linear-gradient(100deg,#ffe08a 0%,#ffb347 40%,#ff6f91 100%);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 6px 18px rgba(255,140,80,.35))}
.tag{color:var(--muted);font-weight:600}

/* cards & type */
.card{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:20px;display:flex;flex-direction:column;gap:12px}
.eyebrow{font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.12em;color:var(--muted)}
.qtext{font-size:22px;line-height:1.3;font-weight:800;text-wrap:balance}
.qsmall{font-size:17px;font-weight:600;text-wrap:balance}
.rtitle{font-family:var(--display);font-weight:800;font-size:clamp(24px,7.6vw,34px);line-height:1.1;letter-spacing:-.01em;color:var(--bulb);text-wrap:balance}
.big-name{font-family:var(--display);font-size:clamp(30px,10vw,44px);line-height:1.05;color:var(--c);overflow-wrap:anywhere}
.muted{color:var(--muted)}
.center{text-align:center}
.fact{font-size:15px;color:var(--muted);border-top:1px dashed var(--line);padding-top:12px}

/* buttons */
.btn{display:block;width:100%;border:0;border-radius:16px;padding:16px 18px;font-family:var(--display);font-weight:700;font-size:16px;letter-spacing:0;background:linear-gradient(180deg,#ffd45c,#ffb52e);color:var(--ink);box-shadow:0 10px 24px -10px rgba(255,180,40,.7),inset 0 1px 0 rgba(255,255,255,.5);transition:transform .08s,box-shadow .08s}
.btn:active{transform:scale(.98);box-shadow:0 4px 12px -6px rgba(255,180,40,.7)}
.btn:disabled{opacity:.35;cursor:default}
.btn.alt{background:transparent;color:var(--fg);border:2px solid var(--line);box-shadow:none}
.btn.pc{background:var(--c);box-shadow:0 5px 0 rgba(0,0,0,.35)}
.linkbtn{background:none;border:0;color:var(--muted);text-decoration:underline;text-underline-offset:3px;padding:8px;font-size:15px}
.stack{display:flex;flex-direction:column;gap:12px}

/* options */
.opts{display:flex;flex-direction:column;gap:10px}
.opt{box-sizing:border-box;display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--bg2);border:2px solid var(--line);border-radius:14px;padding:13px 14px;font-size:17px;font-weight:600;transition:transform .08s}
.opt:active{transform:scale(.98)}
.opt .lt{flex:none;width:30px;height:30px;border-radius:8px;display:grid;place-items:center;font-family:var(--display);font-size:14px;background:var(--line);color:var(--fg)}
.opt.right{border-color:var(--good);background:rgba(74,222,128,.16)}
.opt.right .lt{background:var(--good);color:var(--ink)}
.opt.wrong{border-color:var(--bad);background:rgba(255,90,120,.14)}
.opt.wrong .lt{background:var(--bad);color:var(--ink)}
.opt.dim{opacity:.45}
.opt[disabled]{cursor:default}

/* timer */
.tbar{height:10px;border-radius:999px;background:var(--bg2);overflow:hidden}
.tfill{height:100%;width:100%;background:var(--p1);border-radius:999px;transition:width .1s linear,background .3s}
.tfill.hurry{background:var(--bad)}
.trow{display:flex;justify-content:space-between;align-items:center;font-size:13px;font-weight:800;color:var(--muted)}
.trow b{font-family:var(--display);font-size:18px;color:var(--fg);font-variant-numeric:tabular-nums}

/* verdict */
.verdict{border-radius:14px;padding:14px 16px;font-weight:800;font-size:18px;display:flex;flex-direction:column;gap:2px}
.verdict.ok{background:var(--good);color:var(--ink)}
.verdict.no{background:var(--bad);color:var(--ink)}
.verdict.neutral{background:var(--bg2);border:1px solid var(--line)}
.verdict small{font-weight:600;font-size:15px}
.bdown{font-size:13px;font-weight:700;opacity:.85;margin-top:4px}
.card .bdown{opacity:1;color:var(--fg)}
.rpt{display:block;margin:6px auto 0;font-size:13px;color:var(--muted);background:none;border:0;text-decoration:underline}
.rpt.done{text-decoration:none;color:var(--good)}

.tfbtns{display:grid;grid-template-columns:1fr 1fr;gap:12px}

/* size stage */
.stage{position:relative;height:350px;border-radius:16px;overflow:hidden;background:var(--bg2);border:1px solid var(--line);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px);background-size:100% 25px;background-position:0 -1px;touch-action:none;-webkit-user-select:none;user-select:none}
.stage.live{cursor:ns-resize;border-color:var(--c)}
.stage .ground{position:absolute;left:0;right:0;bottom:0;height:30px;background:var(--panel);border-top:2px solid var(--line)}
.stage .obj{position:absolute;bottom:30px;transform:translateX(-50%);display:flex;align-items:flex-end;justify-content:center;pointer-events:none}
.stage .emo{line-height:1;display:flex;align-items:flex-end;justify-content:center;white-space:nowrap}
.stage .lbl{position:absolute;bottom:6px;transform:translateX(-50%);font-size:12px;font-weight:800;white-space:nowrap;color:var(--muted);max-width:48%;overflow:hidden;text-overflow:ellipsis;z-index:2}
.stage .line{position:absolute;height:0;border-top:2px dashed var(--c);z-index:1;pointer-events:none}
.stage .line span{position:absolute;right:6px;bottom:3px;font-size:11px;font-weight:800;color:var(--c);background:var(--bg2);padding:0 4px;border-radius:4px;white-space:nowrap}
.stage .hint{position:absolute;top:10px;left:0;right:0;text-align:center;font-size:13px;font-weight:600;color:var(--muted);pointer-events:none}
.zoomrow{display:grid;grid-template-columns:52px 1fr 52px;gap:10px;align-items:center}
.zbtn{height:48px;border-radius:12px;border:1px solid var(--line);background:var(--bg2);font-family:var(--display);font-size:24px}
.zbtn:active{background:var(--line)}
.zoomrow input{width:100%;accent-color:var(--c)}
.facts{display:grid;grid-template-columns:1fr auto;gap:6px 12px;font-size:15px}
.facts span:nth-child(even){font-weight:800;text-align:right;font-variant-numeric:tabular-nums}

/* keypad */
.disp{display:flex;align-items:baseline;justify-content:center;gap:8px;background:var(--bg);border-radius:12px;padding:14px;min-height:40px}
.disp #disp{font-family:var(--display);font-size:34px;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.disp .unit{color:var(--muted);font-weight:600}
.keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.key{border:0;border-radius:12px;padding:14px 0;background:var(--bg2);border:1px solid var(--line);font-family:var(--display);font-size:22px}
.key:active{background:var(--line)}
.key.fn{font-family:var(--body);font-weight:800;font-size:16px;color:var(--muted)}

/* results rows */
.rows{display:flex;flex-direction:column;gap:8px}
.row{display:flex;align-items:center;gap:10px;background:var(--bg2);border-radius:12px;padding:10px 12px;border-left:5px solid var(--c)}
.row .who{font-weight:800;flex:1;min-width:0;overflow-wrap:anywhere}
.row .val{font-variant-numeric:tabular-nums;font-weight:600;text-align:right}
.row .pts{font-family:var(--display);font-size:14px;padding:2px 8px;border-radius:999px;background:var(--good);color:var(--ink);white-space:nowrap}
.row .pts.neg{background:var(--bad)}
.row .pts.zero{background:var(--line);color:var(--fg)}
.answer-big{font-family:var(--display);font-size:clamp(34px,11vw,48px);color:var(--bulb);text-align:center;line-height:1.1;font-variant-numeric:tabular-nums}

/* standings */
.bars{display:flex;flex-direction:column;gap:12px}
.bar-l{display:flex;justify-content:space-between;font-weight:800;gap:8px}
.bar-l span:first-child{min-width:0;overflow-wrap:anywhere}
.bar-l span:last-child{font-family:var(--display);font-variant-numeric:tabular-nums}
.bar-t{height:14px;background:var(--bg2);border-radius:999px;overflow:hidden;margin-top:4px}
.bar-f{height:100%;background:var(--c);border-radius:999px;animation:grow .9s cubic-bezier(.2,.8,.2,1)}
@keyframes grow{from{width:0}}

/* setup */
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:13px;font-weight:800;text-transform:uppercase;letter-spacing:.1em;color:var(--c)}
.field input{width:100%;box-sizing:border-box;background:var(--bg);border:2px solid var(--c);border-radius:12px;padding:12px 14px;font:600 18px var(--body);color:var(--fg)}
.field input::placeholder{color:var(--muted);opacity:.6}
.rounds{display:grid;grid-template-columns:auto 1fr;gap:6px 12px;font-size:15px}
.rounds b{font-family:var(--display);color:var(--bulb);font-size:14px}

/* podium */
.podium{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;align-items:end;min-height:230px}
.pod{display:flex;flex-direction:column;align-items:center;gap:6px;min-width:0;text-align:center}
.pod .pn{font-weight:800;font-size:15px;overflow-wrap:anywhere;color:var(--c)}
.pod .ps{font-family:var(--display);font-variant-numeric:tabular-nums}
.pod .blk{width:100%;border-radius:12px 12px 4px 4px;background:var(--c);color:var(--ink);font-family:var(--display);font-size:30px;display:grid;place-items:start center;padding-top:8px;box-sizing:border-box;animation:up .8s cubic-bezier(.2,.8,.2,1) both}
@keyframes up{from{transform:scaleY(.1);transform-origin:bottom}}
.titles{display:flex;flex-direction:column;gap:6px}

/* overlay */
.overlay{position:fixed;inset:0;z-index:20;background:rgba(10,8,30,.78);display:grid;place-items:center;padding:16px}
.overlay .card{width:100%;max-width:400px;box-sizing:border-box}

#confetti{position:fixed;inset:0;pointer-events:none;z-index:30}
.fade{animation:fade .35s ease-out}
@keyframes fade{from{opacity:0;transform:translateY(8px)}}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
}

/* online */
#top,#main,#status{display:flex;flex-direction:column;gap:14px}
#status:empty{display:none}
.msg{background:var(--bg2);border-left:4px solid var(--bad);border-radius:10px;padding:10px 12px;font-weight:600}
.wait{padding:6px 0}
.opt.mine{border-color:var(--bulb);background:rgba(255,231,163,.14)}
.opt .ot{display:flex;flex-direction:column;gap:6px;min-width:0}
.who-dots{display:flex;flex-wrap:wrap;gap:4px}
.wd{font-size:12px;font-weight:800;padding:1px 8px;border-radius:999px;background:var(--c);color:var(--ink)}
.lobby{display:flex;flex-wrap:wrap;gap:8px}
.lp{border:2px solid var(--c);color:var(--c);border-radius:999px;padding:6px 12px;font-weight:800}
.lp small{color:var(--muted);font-weight:600;margin-left:4px}
.row .rank{font-family:var(--display);font-size:22px;color:var(--c);width:28px;text-align:center;flex:none}
.stage .line span[style*="left:6px"]{left:6px;right:auto}
.qtimer{display:flex;align-items:center;gap:10px}
.qtimer .tbar{flex:1}
.qtimer b{font-family:var(--display);font-size:15px;font-variant-numeric:tabular-nums;min-width:44px;text-align:right}
.recs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.rec{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:2px;min-width:0}
.rec-n{font-family:var(--display);font-size:17px;color:var(--bulb);overflow-wrap:anywhere}
.brow{border-left:5px solid var(--bulb)}
button.row{width:100%;text-align:left;font:inherit;color:inherit;border-top:0;border-right:0;border-bottom:0;cursor:pointer}
.av{display:inline-block;flex:none;line-height:0;border-radius:50%;overflow:hidden}
.av svg{width:100%;height:100%;display:block}
.card .av.evolve,.mq-in .av.evolve{display:block;border-radius:18px}
.av.evolve{animation:evolve .9s cubic-bezier(.2,.8,.2,1)}
@keyframes evolve{0%{transform:scale(.6) rotate(-8deg);filter:brightness(2.2)}60%{transform:scale(1.06) rotate(2deg)}100%{transform:none;filter:none}}
.av.shiver{animation:shiver .18s linear infinite}
@keyframes shiver{0%{transform:translateX(0)}25%{transform:translateX(-1.5px)}75%{transform:translateX(1.5px)}}
.chip{display:flex;align-items:center;gap:6px;font:inherit;color:inherit;text-align:left;cursor:default}
button.chip{cursor:pointer}
.chip-t{display:flex;flex-direction:column;min-width:0}
.chip .lv{font-size:10px;font-weight:800;color:var(--muted)}
.chip.on .lv{color:var(--ink)}
.chip .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top{justify-content:flex-end}
.top .iconbtn{padding:4px 12px;font-size:13px;flex:none}
.top{gap:12px;align-items:center;min-height:30px}
.top .qtimer{flex:1;min-width:0}
.chip{padding:5px 7px}
.scl{display:flex;align-items:baseline;flex-wrap:wrap;column-gap:5px;row-gap:0}
.chip .lv{white-space:nowrap}
.chip .sc{font-size:16px;line-height:1.15}
.chip .lv{font-size:10px}
.scores.tall .chip{gap:2px;padding:6px 3px}
.scores.tall .scl{justify-content:center}
.qtext{font-size:19px;line-height:1.28}
.opts{gap:7px}
.opt{padding:9px 12px;font-size:16px;gap:10px}
.opt .lt{width:26px;height:26px;font-size:13px}
#main .mq-in{padding:14px 14px 12px;gap:6px;border-radius:22.5px}
#main .marquee{padding:1.5px}
.logo.one{font-size:clamp(30px,10vw,42px)}
#main .mq-in .tag.small{font-size:13px;margin:0}
.sumrow{display:flex;flex-wrap:wrap;gap:6px}
.rtitle{font-size:clamp(24px,7.5vw,34px)}
.bars{gap:8px}
.bar-t{height:10px}
#main .card{padding:14px 16px;gap:8px}
.btn.stick{position:sticky;bottom:calc(env(safe-area-inset-bottom,0px) + 8px);z-index:5}
#main .answer-big{font-size:clamp(28px,9vw,40px)}
#top,#main{gap:10px}
.card.tight{padding:12px 16px;gap:4px}
.stage .stc{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.hints{display:flex;flex-direction:column;gap:6px}
.hint-i{display:flex;gap:10px;align-items:flex-start;font-size:15px;line-height:1.35}
.hint-i b{flex:none;width:22px;height:22px;border-radius:50%;background:var(--line);display:grid;place-items:center;font-size:12px}
.tl,.mt{display:flex;flex-direction:column;gap:6px}
.tl-i,.mt-i{display:flex;align-items:center;gap:8px;background:var(--bg2);border:2px solid var(--line);border-radius:12px;padding:5px 10px;font-weight:600;font-size:15px;line-height:1.25}
.tl-i>span:first-of-type,.mt-i>span{flex:1;min-width:0}
.tl-i b{flex:none;min-width:24px;height:24px;border-radius:7px;background:var(--line);display:grid;place-items:center;font-size:12px;padding:0 4px}
.tl-i b.yr{min-width:52px;background:var(--bulb);color:var(--ink);font-family:var(--display)}
.tl-b{display:flex;gap:4px;flex:none}
.tlb{width:38px;height:32px;border-radius:9px;border:1px solid var(--line);background:var(--panel);font-size:14px}
.tlb:disabled{opacity:.25}
.tl-i.ok,.mt-i.ok{border-color:var(--good);background:rgba(74,222,128,.14)}
.tl-i.no,.mt-i.no{border-color:var(--bad);background:rgba(255,90,120,.1)}
.mt-i b{flex:none;max-width:50%;text-align:right;color:var(--bulb)}
.mt-s{flex:none;max-width:52%;background:var(--panel);color:var(--fg);border:2px solid var(--line);border-radius:10px;padding:6px 6px;font:600 14px var(--body)}
.pctbar{height:14px;border-radius:999px;background:var(--bg2);overflow:hidden;border:1px solid var(--line)}
.pctbar div{height:100%;background:linear-gradient(90deg,var(--p1),var(--p2))}
.blank{color:var(--bulb);letter-spacing:1px}
.opt .ot small{display:block;font-size:12px;font-weight:600}
.opt.own{cursor:default}
.jk{display:block;width:100%;border:2px dashed var(--p2);background:rgba(255,201,60,.1);color:var(--fg);border-radius:12px;padding:5px 12px;font-weight:700;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:center}
.jk.on{border-style:solid;background:rgba(255,201,60,.22)}
.x2s{font-family:var(--display);color:var(--ink);background:var(--p2);border-radius:8px;padding:1px 7px;font-size:13px;flex:none}

/* Baut für alle Spieler XP, Level, Abzeichen, Freischaltungen, Nemesis, letzte Platzierung. skipV: dieses Spiel ignorieren */
function buildProg(results,skipV){
  const games=(results||[]).filter(r=>r&&Array.isArray(r.players)&&r.players.length>1&&r.v!==skipV).sort((a,b)=>num0(a.at)-num0(b.at));
  const M={};
  games.forEach(g=>{
    const n=g.players.length;
    g.players.forEach(p=>{
      if(!p||typeof p.u!=="string")return;
      const a=M[p.u]||(M[p.u]={u:p.u,name:"",xp:0,games:0,wins:0,streak:0,mcR:0,szHit:0,estWorst:0,finOk:0,badges:{},beatBy:{},last:null});
      a.name=(typeof p.name==="string"&&p.name.trim())||a.name;
      a.xp+=xpOf(p,n);a.games++;
      a.jk=(a.jk||0)+num0(p.jk);a.ud=(a.ud||0)+num0(p.ud);if(p.hcW)a.hcW=(a.hcW||0)+1;if(p.skW)a.skW=(a.skW||0)+1;
      if(typeof p.skG==="string"&&typeof p.skV==="number"){const m=skMetric(p.skG,p.skV);if(m!==null){a.skB=a.skB||{};if(a.skB[p.skG]===undefined||m<a.skB[p.skG])a.skB[p.skG]=m;}}
      const B=id=>{if(!a.badges[id])a.badges[id]=num0(g.at)||1;};
      if(p.rank===1){a.wins++;a.streak++;B("first_win");}else a.streak=0;
      if(a.streak>=3)B("hattrick");if(a.streak>=5)B("serienkiller");
      if(p.rank===1&&num0(p.margin)>=500)B("dominator");
      if(p.rank===1&&num0(p.margin)>0&&num0(p.margin)<=50)B("fotofinish");
      if(p.rank===1&&p.rbf===n&&n>=2)B("comeback");
      if(num0(p.mcN)>=4&&num0(p.mcR)===num0(p.mcN))B("perfekt");
      if(num0(p.mcN)>0&&num0(p.mcR)===0)B("fehlstart");
      a.mcR+=num0(p.mcR);if(a.mcR>=50)B("lexikon");if(a.mcR>=250)B("bibliothek");
      if(num0(p.szEagle)>0)B("adlerauge");
      if(p.sz25all)B("massband");
      a.szHit+=num0(p.szHit);if(a.szHit>=25)B("zollstock");
      if(num0(p.estX)>0)B("punktlandung");
      if(num0(p.estW)>=4)B("schaetzkoenig");
      a.estWorst+=num0(p.estWorst);if(a.estWorst>=5)B("ehrenpreis");
      if(p.finA){
        const allIn=num0(p.finMax)>0&&num0(p.finBet)>=num0(p.finMax);
        if(p.finOk&&allIn)B("allin");
        if(!p.finOk&&allIn)B("pechvogel");
        if(p.finOk&&num0(p.finBet)===0)B("angsthase");
        if(p.finOk){a.finOk++;if(a.finOk>=10)B("finalkoenig");}
      }
      if(num0(p.score)<0)B("rote_laterne");
      if(typeof p.hr==="number"&&p.hr>=0&&p.hr<5)B("nachteule");
      if(a.games>=10)B("stammgast");if(a.games>=50)B("inventar");if(a.games>=100)B("hundertschaft");
      if(n>=6)B("rudel");
      g.players.forEach(o=>{if(o&&o.u!==p.u&&typeof o.u==="string"&&num0(o.rank)<num0(p.rank))a.beatBy[o.u]=(a.beatBy[o.u]||0)+1;});
      a.last=p.rank===1?"krone":(p.rank===n&&n>=2&&p.rank!==1?"esel":null);
    });
  });
  Object.values(M).forEach(a=>{
    a.lvl=levelOf(a.xp);
    let nem=null;Object.keys(a.beatBy).forEach(u=>{if(a.beatBy[u]>=2&&(!nem||a.beatBy[u]>a.beatBy[nem]))nem=u;});

    Object.keys(a.badges).forEach(b=>{if(BADGE_ITEMS[b])un[BADGE_ITEMS[b]]=1;});
    Object.keys(UNLOCKS).forEach(i=>{if(UNLOCKS[i][1](a))un[i]=1;});
    a.unlocked=un;
  });
  return M;
}

function modeSteps(m,used){
  const out=[];
  if(m==="size"){pick(used,SIZE,"size",4).forEach((q,i)=>{const ratio=O[q.b].h/O[q.a].h,hi=Math.min(110,290/ratio),lo=Math.min(48,hi);out.push({t:"size",q:q,refPx:Math.round(lo+Math.random()*(hi-lo))});});}
  else if(m==="est"){pick(used,EST,"est",4).forEach(q=>out.push({t:"est",q:q}));}
  else if(m==="time"){
    const taken={};
    for(let s=0;s<3;s++){
      let sel=[];
      for(let tries=0;tries<30&&sel.length<4;tries++){
        sel=[];
        for(const i of shuffle(EVENTS.map((_,j)=>j))){if(taken[i])continue;if(sel.every(j=>Math.abs(EVENTS[j][1]-EVENTS[i][1])>=5))sel.push(i);if(sel.length===4)break;}
      }
      sel.forEach(i=>{taken[i]=1;});
      out.push({t:"time",items:sel.map(i=>({n:EVENTS[i][0],y:EVENTS[i][1],l:EVENTS[i][2]||String(EVENTS[i][1])}))});
    }
  }
  else if(m==="pct"){pick(used,PCT,"pct",4).forEach(q=>out.push({t:"pct",q:q}));}
  else if(m==="match"){
    pick(used,MATCHC,"match",3).forEach(c=>{
      const seen={},pairs=[];
      shuffle(c.p).forEach(p=>{if(pairs.length<4&&!seen[p[1]]){seen[p[1]]=1;pairs.push(p);}});
      const R=shuffle(pairs.map(p=>p[1]));
      out.push({t:"match",q:c.q,L:pairs.map(p=>p[0]),R:R,sol:pairs.map(p=>R.indexOf(p[1]))});
    });
  }
  else if(m==="odd"){pick(used,ODD,"odd",5).forEach(o=>out.push({t:"odd",q:{q:"Welcher Begriff passt nicht dazu?",a:o.i.slice(),f:o.f},opts:shuffle(o.i)}));}
  else if(m==="who"){pick(used,WHO,"who",3).forEach(w=>out.push({t:"who",q:{h:w.h.slice(),a:w.a.slice()},opts:shuffle(w.a)}));}
  else if(m==="hl"){
    const done={};
    for(let s=0;s<5;s++){
      let made=null;
      for(let tries=0;tries<60&&!made;tries++){
        const c=HLD[Math.floor(Math.random()*HLD.length)],two=shuffle(c.it).slice(0,2),a=two[0],b=two[1];
        const key=[a[0],b[0]].sort().join("|");if(done[key])continue;
        const ok=c.gap?Math.abs(a[1]-b[1])>=c.gap:Math.max(a[1],b[1])/Math.min(a[1],b[1])>=c.min;
        if(!ok)continue;
        done[key]=1;
        const win=(c.cmp>0?(a[1]>b[1]):(a[1]<b[1]))?a:b,lose=win===a?b:a;
        const fv=v=>c.u?fmt(v)+" "+c.u:String(v);
        made={t:"hl",q:{q:c.q,a:[win[0],lose[0]],f:win[0]+": "+fv(win[1])+" · "+lose[0]+": "+fv(lose[1])},opts:shuffle([win[0],lose[0]])};
      }
      if(made)out.push(made);
    }
  }
  else if(m==="bluff"){pick(used,BLUFF,"bluff",2).forEach(q=>{out.push({t:"bluffw",q:q});out.push({t:"bluffv",q:q});});}
  const qs=out.filter(x=>x.t!=="bluffv");
  let n=0;out.forEach(x=>{if(x.t!=="bluffv")n++;x.n=n;x.of=qs.length;});
  return out;
}

function skTick(st,now){

function skTap(k,el){

function skCircleScore(p){

  if(L<150)return null;
  cx/=L;cy/=L;
  let mr=0;const rr=[];
  for(let i=1;i<p.length;i++){const r=Math.hypot((p[i][0]+p[i-1][0])/2-cx,(p[i][1]+p[i-1][1])/2-cy);rr.push(r);mr+=r*seg[i-1];}
  mr/=L;if(mr<35)return null;
  let va=0;rr.forEach((r,i)=>{va+=seg[i]*(r-mr)*(r-mr);});
  const cvr=Math.sqrt(va/L)/mr,bins={};
  for(let i=1;i<p.length;i++)for(let k=0;k<6;k++){const f=k/6,x=p[i-1][0]+(p[i][0]-p[i-1][0])*f,y=p[i-1][1]+(p[i][1]-p[i-1][1])*f;bins[Math.floor((Math.atan2(y-cy,x-cx)+Math.PI)/(2*Math.PI)*36)%36]=1;}

function timeCorrect(st){return st.items.map((_,i)=>i).sort((a,b)=>st.items[a].y-st.items[b].y);}
function pctPts(d,u){const s=u&&hcOf(u)>=2?0.5:1;return d<=2*s?150:d<=5*s?100:d<=10*s?50:0;}
function normB(s){return String(s||"").toLowerCase().replace(/ä/g,"ae").replace(/ö/g,"oe").replace(/ü/g,"ue").replace(/ß/g,"ss").replace(/[^a-z0-9]/g,"");}
function isTruth(q,txt){const n=normB(txt);if(!n)return false;return [q.a].concat(q.alt||[]).some(t=>{const m=normB(t);return n===m||(m.length>=4&&n.indexOf(m)>=0);});}
function bluffOpts(i){
  const st=G.steps[i],R=roster(),groups={},order=[];
  R.forEach(u=>{const a=getAns(u,i-1);if(typeof a!=="string")return;const t=a.trim().slice(0,40);if(!t||isTruth(st.q,t))return;const k=normB(t);if(!k)return;
    if(!groups[k]){groups[k]={text:t,truth:false,owners:[]};order.push(k);}groups[k].owners.push(u);});
  const list=order.map(k=>groups[k]);list.push({text:st.q.a,truth:true,owners:[]});
  const seed=G.v+"|"+i;
  return list.map(o=>({o:o,s:hashN(o.text+seed,1000000007)})).sort((x,y)=>x.s-y.s||(x.o.text<y.o.text?-1:1)).map(x=>x.o);
}
function miniPoints(st,i,R,pts){
  if(CHOICE[st.t]){R.forEach((u,k)=>{const a=getAns(u,i);if(typeof a==="number"&&st.opts[a]===st.q.a[0])pts[k]=100;});
    if(st.q&&st.q.by){const k=R.indexOf(st.q.by),g=k>=0?authGuess(st,i,st.q.by):null;if(g!==null&&g===authHits(st,i))pts[k]=100;}
    return true;}
  if(st.t==="who"){R.forEach((u,k)=>{const a=getAns(u,i);if(a&&typeof a.a==="number"&&st.opts[a.a]===st.q.a[0]){const hn=Math.max(1,Math.min(5,Math.round(Number(a.h)||1)));pts[k]=200-40*(hn-1);}});return true;}
  if(st.t==="time"){const c=timeCorrect(st);R.forEach((u,k)=>{const a=getAns(u,i);if(Array.isArray(a))pts[k]=50*c.filter((j,pos)=>a[pos]===j).length;});return true;}
  if(st.t==="pct"){R.forEach((u,k)=>{const a=getAns(u,i);if(typeof a==="number"&&isFinite(a))pts[k]=pctPts(Math.abs(a-st.q.a),u);});return true;}
  if(st.t==="match"){R.forEach((u,k)=>{const a=getAns(u,i);if(Array.isArray(a))pts[k]=50*st.sol.filter((s,j)=>a[j]===s).length;});return true;}
  if(st.t==="bluffw")return true;
  if(st.t==="bluffv"){
    const O2=bluffOpts(i);
    R.forEach((u,k)=>{const a=getAns(u,i);if(typeof a!=="number"||!O2[a])return;const o=O2[a];
      if(o.truth)pts[k]+=200;else o.owners.forEach(ow=>{if(ow!==u){const j=R.indexOf(ow);if(j>=0)pts[j]+=100;}});});
    return true;
  }
  return false;
}

function isAuthor(st,u){return !!(st&&st.q&&st.q.by&&st.q.by===u);}
function authGuess(st,i,u){const a=getAns(u,i);return a&&typeof a==="object"&&typeof a.g==="number"?a.g:null;}
function authHits(st,i){return roster().filter(u=>u!==st.q.by&&(a=>typeof a==="number"&&st.opts[a]===st.q.a[0])(getAns(u,i))).length;}

function breakdownHtml(st){

  const i=G.idx,R=roster(),k=R.indexOf(ME),sb=scoresAt(i),base=stepBase(st,i,sb),b=base[k];
  if(!(b>0))return '';

}

    return (o?(o.truth?'hat die echte gefunden':'ist reingefallen'):'keine Stimme')+(fooled?' · hat '+fooled+' reingelegt':'');})+hostBtn("Weiter","next");
}

const COLS=["#ff7a59","#3ed6c0","#ffc93c","#ff8fd8","#6cb8ff","#b8f06a"];

/* ---------- Helfer ---------- */
function h(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
function rnd(a){return a[Math.floor(Math.random()*a.length)];}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));const t=a[i];a[i]=a[j];a[j]=t;}return a;}
function fmt(n,y){return y?String(n):Number(n).toLocaleString("de-DE");}
function sgn(n){return n>0?"+"+fmt(n):n<0?"−"+fmt(-n):"±0";}
function rid(){return Math.random().toString(36).slice(2,10)+Date.now().toString(36);}
function mFmt(m){
  if(m>=100)return fmt(Math.round(m))+" m";
  if(m>=10)return (Math.round(m*10)/10).toLocaleString("de-DE")+" m";
  return m.toLocaleString("de-DE",{maximumFractionDigits:2})+" m";
}
function roster(){return (G&&Array.isArray(G.roster))?G.roster:[];}
function lobbyPlayers(){
  if(!G)return [];
  return Object.keys(P).filter(u=>P[u]&&P[u].g===G.v).sort((a,b)=>(P[a].t||0)-(P[b].t||0)).slice(0,MAXP);
}
function colOf(u){
  let i=roster().indexOf(u);
  if(i<0)i=lobbyPlayers().indexOf(u);
  return COLS[(i<0?0:i)%COLS.length];
}
function cv(u){return 'style="--c:'+colOf(u)+'"';}
function nameOf(u){const p=P[u];const n=p&&typeof p.name==="string"?p.name.trim():"";return n||"Mitspieler";}
function nm(u){return h(nameOf(u));}
function amHost(){return !!(G&&ME&&G.host===ME);}
function inGame(){return roster().indexOf(ME)>=0;}
function step(){return G&&G.steps?G.steps[G.idx]:null;}
function isQ(st){return !!(st&&QTYPES[st.t]);}
function getAns(u,i){
  const A=G&&G.A&&G.A[String(i)];
  if(A&&typeof A==="object"){const v=A[u];return v===undefined?null:v;}
  const p=P[u];if(!p||p.g!==G.v||!p.ans)return null;
  const v=p.ans[String(i)];return v===undefined?null:v;
}
function answeredAll(){const i=G.idx;return roster().every(u=>getAns(u,i)!==null||expired(u));}
function hostName(){return G&&G.host?nm(G.host):"Spielleitung";}

/* ---------- Punkte (jeder rechnet gleich) ---------- */
function sizeScore(st,r,u){
  const truth=O[st.q.b].h/O[st.q.a].h;
  const pct=Math.round(Math.abs(r-truth)/truth*100),s=u&&hcOf(u)>=2?0.5:1;
  return {pct:pct,pts:pct<=10*s?150:pct<=25*s?100:pct<=50*s?50:0,big:r>truth};
}
function stepPoints(st,i,sb){return applyBonus(st,i,sb,stepBase(st,i,sb));}
function stepBase(st,i,sb){
  const R=roster(),pts=R.map(()=>0);
  if(extraPoints(st,i,R,pts)||miniPoints(st,i,R,pts)){
  }else if(st.t==="size"){
    R.forEach((u,k)=>{const a=getAns(u,i);if(typeof a==="number"&&a>0&&isFinite(a))pts[k]=sizeScore(st,a,u).pts;});
  }else if(st.t==="est"){
    const d=R.map(u=>{const a=getAns(u,i);return (typeof a==="number"&&isFinite(a))?Math.abs(a-st.q.a)*(hcOf(u)>=2?2:1):null;});
    const valid=d.filter(x=>x!==null);
    if(valid.length){const mn=Math.min.apply(null,valid);d.forEach((x,k)=>{if(x===mn)pts[k]=mn===0?300:150;});}
  }else if(st.t==="event"){
    if(R.length){const mn=Math.min.apply(null,sb),mx=Math.max.apply(null,sb);if(mn!==mx)sb.forEach((x,k)=>{if(x===mn)pts[k]=100;});}
  }else if(st.t==="fin"){
    R.forEach((u,k)=>{
      const a=getAns(u,i);if(!a||typeof a!=="object"||typeof a.a!=="number")return;
      const b=Math.max(0,Math.min(Math.max(100,sb[k]),Math.round(Number(a.b)||0)));
      pts[k]=st.opts[a.a]===st.q.a[0]?b:-b;
    });
  }
  return pts;
}
function scoresAt(limit){
  const R=roster();let sc=R.map(()=>0);
  if(!G||!G.steps)return sc;

function guideLines(rp,G0){
  const top=STAGE_H-G0-30;let out='';
  const fmtF=f=>(f===0.5?'½':f===0.25?'¼':String(f))+'×';
  const add=f=>{const y=rp*f;if(y<10||y>top)return;out+='<div class="hl" style="bottom:'+(G0+y)+'px"><b class="hlx">'+fmtF(f)+'</b></div>';};
  if(rp*0.25>=16)add(0.25);
  if(rp*0.5>=14)add(0.5);
  const step=[1,2,5,10,20,50,100].find(k=>rp*k>=24)||100;
  for(let f=step===1?2:step;rp*f<=top;f+=step)add(f);
  return out;
}

function bindStage(){
  const el=document.getElementById("stage");if(!el)return;
  const ptrs=new Map();let base=null;
  const dist=()=>{const v=[...ptrs.values()];return Math.hypot(v[0].x-v[1].x,v[0].y-v[1].y)||1;};
  el.addEventListener("pointerdown",e=>{try{el.setPointerCapture(e.pointerId);}catch(_){}ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});base=null;e.preventDefault();});
  el.addEventListener("pointermove",e=>{
    if(!ptrs.has(e.pointerId))return;
    ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
    if(ptrs.size>=2){const d=dist();if(!base||base.m!=="p")base={m:"p",d:d,r:L.r};else setR(base.r*d/base.d);}
    else{const y=e.clientY;if(!base||base.m!=="d")base={m:"d",y:y,r:L.r};else setR(base.r*Math.exp((base.y-y)/140));}
  });
  const up=e=>{ptrs.delete(e.pointerId);base=null;};
  el.addEventListener("pointerup",up);el.addEventListener("pointercancel",up);

function stopConfetti(){if(confettiRaf){cancelAnimationFrame(confettiRaf);confettiRaf=null;}const c=document.getElementById("confetti");if(c)c.remove();}
function startConfetti(){
  if(window.matchMedia&&window.matchMedia("(prefers-reduced-motion: reduce)").matches)return;
  const c=document.createElement("canvas");c.id="confetti";document.body.appendChild(c);
  const x=c.getContext("2d");if(!x)return;
  const W=c.width=window.innerWidth,H=c.height=window.innerHeight,P2=[];
  for(let i=0;i<140;i++)P2.push({x:Math.random()*W,y:-Math.random()*H,vx:(Math.random()-.5)*2,vy:2+Math.random()*3,r:Math.random()*6.28,vr:(Math.random()-.5)*.3,w:6+Math.random()*6,h:4+Math.random()*4,c:COLS[i%COLS.length]});
  const t0=performance.now();
  const loop=t=>{x.clearRect(0,0,W,H);const done=t-t0>5000;let alive=0;
    P2.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.r+=p.vr;if(p.y>H+20){if(done)return;p.y=-10;p.x=Math.random()*W;}alive++;x.save();x.translate(p.x,p.y);x.rotate(p.r);x.fillStyle=p.c;x.fillRect(-p.w/2,-p.h/2,p.w,p.h);x.restore();});
    if(alive>0)confettiRaf=requestAnimationFrame(loop);else stopConfetti();};
  confettiRaf=requestAnimationFrame(loop);sfx.win();
}

function gameSummary(){
  const R=roster(),sc=curScores(),rank=(arr,k)=>1+arr.filter(v=>v>arr[k]).length;
  const S=R.map((u,k)=>({u:u,name:nameOf(u),score:sc[k],rank:rank(sc,k),margin:0,rbf:0,mcR:0,mcN:0,szSum:0,szN:0,szHit:0,szEagle:0,sz25all:false,szMax:0,estW:0,estX:0,estWorst:0,finA:false,finOk:false,finBet:0,finMax:0,jk:0,ud:0,hr:new Date().getHours()}));
  R.forEach((u,k)=>{if(S[k].rank===1){const others=sc.filter((v,j)=>j!==k);S[k].margin=others.length?sc[k]-Math.max.apply(null,others):0;}});
  let sb=R.map(()=>0),szSteps=0;
  G.steps.forEach((st,i)=>{
    const pts=stepPoints(st,i,sb.slice());
    if(st.t==="size")szSteps++;
    if(st.t==="fin")R.forEach((u,k)=>{S[k].rbf=rank(sb,k);});
    let estD=null;
    if(st.t==="est"){
      estD=R.map(u=>{const a=getAns(u,i);return typeof a==="number"?Math.abs(a-st.q.a):null;});
      const v=estD.filter(x=>x!==null);
      if(v.length>=2){const mx=Math.max.apply(null,v),mn=Math.min.apply(null,v);if(mx>mn)estD.forEach((x,k)=>{if(x===mx)S[k].estWorst++;});}
    }
    const bq=isQ(st)&&!NOBONUS[st.t],base=bq?stepBase(st,i,sb.slice()):null,ld=bq?underdogIdx(sb):-1;
    R.forEach((u,k)=>{
      const a=getAns(u,i),o=S[k];
      if(bq&&jokerOf(u,i)&&pts[k]>0)o.jk=1;
      if(bq&&ld>=0&&ld!==k&&base[ld]<=0&&base[k]>0)o.ud++;
      if(st.t==="skill"&&typeof a==="number"){o.skG=st.g;o.skV=a;o.skW=base[k]===150;}
      if(st.t==="mc"){o.mcN++;if(pts[k]>0)o.mcR++;}
      else if(st.t==="size"&&typeof a==="number"&&a>0){const r=sizeScore(st,a);o.szN++;o.szSum+=r.pct;o.szMax=Math.max(o.szMax,r.pct);if(r.pct<=10)o.szHit++;if(r.pct<=3)o.szEagle++;}
      else if(st.t==="est"&&pts[k]>0){o.estW++;if(pts[k]===300)o.estX++;}
      else if(st.t==="fin"&&a&&typeof a.a==="number"){o.finA=true;o.finOk=st.opts[a.a]===st.q.a[0];o.finBet=Math.abs(pts[k]);o.finMax=Math.max(100,sb[k]);}
    });
    sb=sb.map((v,k)=>v+pts[k]);
  });
  S.forEach(o=>{o.hcW=o.rank===1&&hcOf(o.u)>=1;});
  S.forEach(o=>{o.sz25all=szSteps>0&&o.szN===szSteps&&o.szMax<=25;});
  return {v:G.v,at:Date.now(),n:R.length,players:S};
}
function aggregate(){
  const A={};
  const games=RES.filter(r=>r&&Array.isArray(r.players)&&r.players.length>1).sort((a,b)=>(a.at||0)-(b.at||0));
  games.forEach(g=>g.players.forEach(p=>{
    if(!p||typeof p.u!=="string")return;
    const a=A[p.u]||(A[p.u]={u:p.u,name:"",games:0,wins:0,pts:0,best:null,mcR:0,mcN:0,szSum:0,szN:0,szHit:0,estW:0,estX:0,finN:0,finOk:0,betSum:0,betMax:0});
    const num=x=>typeof x==="number"&&isFinite(x)?x:0;
    a.name=(typeof p.name==="string"&&p.name.trim())||a.name;
    a.games++;if(p.rank===1)a.wins++;
    a.pts+=num(p.score);if(a.best===null||num(p.score)>a.best)a.best=num(p.score);
    a.mcR+=num(p.mcR);a.mcN+=num(p.mcN);a.szSum+=num(p.szSum);a.szN+=num(p.szN);a.szHit+=num(p.szHit);
    a.estW+=num(p.estW);a.estX+=num(p.estX);
    if(p.finA){a.finN++;if(p.finOk)a.finOk++;a.betSum+=num(p.finBet);a.betMax+=num(p.finMax);}
  }));
  return {list:Object.values(A),games:games.length};
}
function pct(a,b){return b?Math.round(a/b*100):null;}

  const tiles=[

  ].filter(t=>t[1]);
  let rec='<div class="recs">'+tiles.map(t=>'<div class="rec"><div class="eyebrow">'+t[0]+'</div><div class="rec-n">'+nmx(t[1].a)+'</div><div class="muted">'+t[2](t[1].v)+'</div></div>').join('')+'</div>';
  const sorted=L2.slice().sort((a,b)=>(b.wins-a.wins)||((b.pts/b.games)-(a.pts/a.games)));

  const seen=lobbySeen[G.v]||(lobbySeen[G.v]={});
  lobbyPlayers().forEach(u=>{
    if(seen[u])return;seen[u]=1;
    if(firstChange)return;
    const f=figFx(u),phx=u===FOUNDER&&isPhx();
    setTimeout(()=>{
      if(!fxAllowed())return;
      showToast('<span class="toast-e">'+(phx?'🐦‍🔥':Array.from(f.e)[0])+'</span>'+avHtml(u,34)+'<span><strong>'+nm(u)+'</strong> ist da: '+h(f.land)+'</span>',()=>{
        if(!fxAllowed())return;if(phx){fxParticles("embers");sfx.fanfare();return;}fxParticles("rise:"+f.e);sfx.fanfare();});
    },300);
  });
}
function figRevealFx(){

  const pts=stepPoints(st,G.idx,scoresAt(G.idx)),delay=st.t==="fin"?1100+R.length*600:300;
  const bad=R.filter((u,k)=>pts[k]<=0);if(!bad.length)return;

}

function hostTick(){

  const st=step();if(!isQ(st)||G.reveal)return;
  const k=G.v+"|"+G.idx,now=Date.now();

    if(dlSet!==k){dlSet=k;gWrite(()=>gRef().update({dl:now+Q_TIME,dlk:k,ds:now}));}
    return;
  }
  const R=roster(),missing=R.filter(u=>getAns(u,G.idx)===null&&!expired(u)).length;
  if(missing===0&&revealPending!==k){revealPending=k;hostReveal();return;}
  if(R.length>1&&missing===1&&G.dl-now>Q_LAST&&dlShort!==k){dlShort=k;gWrite(()=>gRef().update({dl:now+Q_LAST}));}
  if(now>=G.dl&&revealPending!==k){revealPending=k;hostReveal();}
}

    f.classList.toggle("hurry",left<=Q_LAST);

}

  if(!gotGame||!gotPlayers)return;

  const rk=G?G.v+"|"+G.idx+"|"+G.reveal:null;
  if(G&&G.reveal&&prevReveal!==rk&&!firstChange&&inGame())revealFx();

  figLobbyFx();

    resWritten=G.v;const sum=gameSummary();

}

function gameHighlights(){

  let bestEst=null,bestBluff=null,fin=null,skill=null;const zero=R.map(()=>0);

    if(st.t==="fin"){const p=stepPoints(st,i,scoresAt(i));fin={p:p};}
    if(st.t==="skill"){const m=R.map(u=>skMetric(st.g,getAns(u,i)));let k=-1;m.forEach((x,j)=>{if(x!==null&&(k<0||x<m[k]))k=j;});if(k>=0)skill={u:R[k],g:st.g,v:getAns(R[k],i)};}
    if(isQ(st)&&["mc","odd","hl","who","time","pct","match","size","est","bluffv"].indexOf(st.t)>=0){const p=stepPoints(st,i,scoresAt(i));R.forEach((u,k)=>{if(p[k]<=0)zero[k]++;});}

}

function dailyStreak(u){let n=0,t=Date.now();for(let k=0;k<400;k++){const d=dailyOf(u,dayKey(t-k*86400000));if(d&&d.ok)n++;else if(k===0)continue;else break;}return n;}

/* ---------- Monatsliga ---------- */
function leagueOf(mk){
  const M={},add=(u,name,p,key)=>{const a=M[u]||(M[u]={u:u,name:"",pts:0,w:0,g:0,dq:0});if(name)a.name=name;a.pts+=p;if(key)a[key]++;};
  RES.forEach(r=>{if(!r||!Array.isArray(r.players)||r.players.length<2||monthKey(r.at)!==mk)return;const n=r.players.length,tab=n===2?[3,1]:[5,3,1];
    r.players.forEach(p=>{if(!p||typeof p.u!=="string")return;add(p.u,p.name,tab[(p.rank||9)-1]||0,"g");if(p.rank===1)M[p.u].w++;});});
  DAILY.forEach(d=>{if(d&&d.ok&&typeof d.d==="string"&&d.d.slice(0,7)===mk)add(d.u,d.name,1,"dq");});
  return Object.values(M).sort((a,b)=>b.pts-a.pts||b.w-a.w);
}
function monthChampions(){
  const cur=monthKey(),ms={};RES.forEach(r=>{if(r&&r.at)ms[monthKey(r.at)]=1;});DAILY.forEach(d=>{if(d&&d.d)ms[d.d.slice(0,7)]=1;});
  const champ={};Object.keys(ms).filter(m=>m<cur).forEach(m=>{const L2=leagueOf(m);if(!L2.length||L2[0].pts<=0)return;L2.filter(a=>a.pts===L2[0].pts).forEach(a=>{(champ[a.u]=champ[a.u]||[]).push(m);});});
  return champ;
}
function vLeague(full){
  const mk=monthKey(),L2=leagueOf(mk);
  let out='<div class="card fade"><div class="eyebrow">🏆 Liga '+monthName(mk)+'</div>';
  if(!L2.length)out+='<p class="muted">Noch keine Punkte diesen Monat. Spielt eine Runde oder beantwortet die Tagesfrage!</p>';
  else out+='<div class="rows">'+(full?L2:L2.slice(0,3)).map((a,i)=>'<div class="row" '+cv(a.u)+'><span class="rank">'+(i+1)+'</span><span class="who">'+h(a.name||nameOf(a.u))+(a.u===ME?' <small class="muted">(du)</small>':'')+'<br><span class="muted" style="font-weight:600;font-size:12px">'+a.w+' Siege · '+a.g+' Spiele · '+a.dq+' Tagesfragen</span></span><span class="pts">'+a.pts+'</span></div>').join('')+'</div>';
  out+='<p class="muted small">Sieg 5 · Platz 2: 3 · Platz 3: 1 · Tagesfrage richtig: 1. Zu zweit: Sieg 3, Platz 2: 1. Am Monatsende gibt es den Titel „Monatschampion“.</p>';
  if(full){const ch=monthChampions(),rows=[];Object.keys(ch).forEach(u=>ch[u].forEach(m=>rows.push([m,u])));rows.sort((a,b)=>a[0]<b[0]?1:-1);
    if(rows.length)out+='<div class="eyebrow" style="margin-top:8px">Bisherige Monatschampions</div>'+rows.map(r=>'<p class="small">👑 '+monthName(r[0])+': <b>'+h(progOf(r[1]).name||nameOf(r[1]))+'</b></p>').join('');}
  return out+'</div>';
}

const THEME_ICON={mix:"🎲",bayern:"🥨",sport:"⚽",welt:"🌍",natur:"🌿",kultur:"🎬",alltag:"🍽️"};
const H_IW=124;
function hw3d(w){const c=w.scrollLeft+w.clientWidth/2;w.querySelectorAll(".hitem").forEach(it=>{const d=Math.min(2,Math.abs(it.offsetLeft+it.offsetWidth/2-c)/H_IW);it.style.transform="scale("+(1-0.16*d)+")";it.style.opacity=String(Math.max(0.3,1-0.4*d));});}
function lobbyWheel(id,TK,cur,pick){
  const w=document.getElementById(id);if(!w||w._init||!G||G.phase!=="lobby")return;w._init=1;
  let idx=TK.indexOf(cur());if(idx<0)idx=0;
  w.scrollLeft=idx*H_IW;w._last=idx;hw3d(w);
  w.addEventListener("scroll",()=>{
    if(!w._raf)w._raf=requestAnimationFrame(()=>{w._raf=0;hw3d(w);const i=Math.round(w.scrollLeft/H_IW);if(i!==w._last){w._last=i;if(fxAllowed())tone([1500],0.02,"square",0);}});
    clearTimeout(w._t);w._t=setTimeout(()=>{if(!w.isConnected)return;const i=Math.max(0,Math.min(TK.length-1,Math.round(w.scrollLeft/H_IW))),t=TK[i];
      if(t!==cur()&&amHost()&&G&&G.phase==="lobby")pick(t);},160);
  },{passive:true});
  w.addEventListener("click",e=>{const it=e.target.closest(".hitem");if(it)w.scrollTo({left:Number(it.dataset.wi)*H_IW,behavior:"smooth"});});
}

const THEMES={mix:["Gemischt",null],bayern:["Bayern & München",["bayern"]],sport:["Sport",["sport"]],welt:["Geschichte & Welt",["geschichte","geo"]],natur:["Natur & Wissen",["natur","wissen"]],kultur:["Kultur & Unterhaltung",["kultur"]],alltag:["Essen & Alltag",["essen","alltag"]]};
let themeLocal=null,teamLocal=null;
function themeOf(){if(themeLocal&&G&&themeLocal.v===G.v&&Date.now()-themeLocal.t<8000){if(G.used&&G.used.theme===themeLocal.x)themeLocal=null;else return themeLocal.x;}const t=G&&G.used&&G.used.theme;return THEMES[t]?t:"mix";}
function teamsOn(){if(teamLocal&&G&&teamLocal.v===G.v&&Date.now()-teamLocal.t<8000){if(G.used&&!!G.used.teams===teamLocal.x)teamLocal=null;else return teamLocal.x;}return !!(G&&G.used&&G.used.teams);}
function pickTheme(used,pool,key,n,cats,TH){
  if(!cats)return pick(used,pool,key,n);
  const ok=pool.map((_,i)=>i).filter(i=>cats.indexOf(TH[i])>=0);
  let u=Array.isArray(used[key])?used[key].slice():[];
  let avail=ok.filter(i=>u.indexOf(i)<0);
  if(avail.length<n){u=u.filter(i=>ok.indexOf(i)<0);avail=ok.slice();}
  const ch=shuffle(avail).slice(0,n);used[key]=u.concat(ch);return ch.map(i=>pool[i]);
}

/* ---------- Teams ---------- */
const TEAMN=[["Team Rot","🔴","#ff5a5f"],["Team Blau","🔵","#4a90e2"]];
function makeTeams(R){const s=R.slice().sort((a,b)=>progOf(b).lvl-progOf(a).lvl),t={};s.forEach((u,i)=>{t[u]=[0,1,1,0][i%4];});return t;}
function teamScores(sc){
  if(!G||!G.teams)return null;const R=roster(),s=[0,0],n=[0,0];
  R.forEach((u,k)=>{const t=G.teams[u];if(t===0||t===1){s[t]+=sc[k];n[t]++;}});
  if(!n[0]||!n[1])return null;const mx=Math.max(n[0],n[1]);
  return [Math.round(s[0]*mx/n[0]),Math.round(s[1]*mx/n[1]),n[0]!==n[1]];
}
function teamWinner(){const ts=teamScores(curScores());if(!ts)return null;if(ts[0]===ts[1])return "Teams unentschieden!";const w=ts[0]>ts[1]?0:1;return TEAMN[w][1]+" "+TEAMN[w][0]+" gewinnt!";}

  const wrap=d=>({id:d.id,exists:d.exists,data:()=>d.data()});
  const clean=x=>JSON.parse(JSON.stringify(x));
  const flat=(o,pre,out)=>{for(const k in o){const v=o[k],p=pre.concat(k);if(v&&typeof v==="object"&&!Array.isArray(v)&&Object.keys(v).length)flat(v,p,out);else out.push([p,v]);}return out;};
  const D={

      update:d=>{const pr=flat(clean(d),[],[]);if(!pr.length)return Promise.resolve();const a=[];pr.forEach(([p,v])=>a.push(new firebase.firestore.FieldPath(...p),v));return r.update(...a);},
      delete:()=>r.delete(),
      get:()=>r.get().then(wrap),
      onSnapshot:(fn,err)=>r.onSnapshot(x=>fn(wrap(x)),err)};},
    collection:c=>({onSnapshot:(fn,err)=>fs.collection(c).onSnapshot(x=>fn({docs:x.docs.map(wrap)}),err)})
